acity=".035" stroke="#ffffff" stroke-opacity=".09"/><text x="56" y="208" class="sans" font-size="27" font-weight="800" fill="url(#neon)">84.6%</text><text x="56" y="231" class="mono" font-size="11" fill="#94a3b8">agent accuracy</text><text x="56" y="247" class="mono" font-size="11" fill="#475569">26-question eval</text></g><g class="pop" style="animation-delay:0.45s"><rect x="230" y="170" width="178" height="92" rx="12" fill="#ffffff" fill-opacity=".035" stroke="#ffffff" stroke-opacity=".09"/><text x="246" y="208" class="sans" font-size="27" font-weight="800" fill="url(#neon)">25→100%</text><text x="246" y="231" class="mono" font-size="11" fill="#94a3b8">text-to-SQL, 1.5B</text><text x="246" y="247" class="mono" font-size="11" fill="#475569">after LoRA fine-tune</text></g><g class="pop" style="animation-delay:0.60s"><rect x="420" y="170" width="178" height="92" rx="12" fill="#ffffff" fill-opacity=".035" stroke="#ffffff" stroke-opacity=".09"/><text x="436" y="208" class="sans" font-size="27" font-weight="800" fill="url(#neon)">0.88</text><text x="436" y="231" class="mono" font-size="11" fill="#94a3b8">recall@6, hybrid</text><text x="436" y="247" class="mono" font-size="11" fill="#475569">search + reranker</text></g><rect x="40" y="296" width="58" height="22" rx="11" fill="#a855f7" fill-opacity=".08" stroke="#a855f7" stroke-opacity=".35"/><text x="49" y="311" class="mono" font-size="11" fill="#a855f7">Agents</text><rect x="106" y="296" width="38" height="22" rx="11" fill="#a855f7" fill-opacity=".08" stroke="#a855f7" stroke-opacity=".35"/><text x="115" y="311" class="mono" font-size="11" fill="#a855f7">RAG</text><rect x="151" y="296" width="44" height="22" rx="11" fill="#a855f7" fill-opacity=".08" stroke="#a855f7" stroke-opacity=".35"/><text x="160" y="311" class="mono" font-size="11" fill="#a855f7">LoRA</text><rect x="204" y="296" width="38" height="22" rx="11" fill="#a855f7" fill-opacity=".08" stroke="#a855f7" stroke-opacity=".35"/><text x="213" y="311" class="mono" 