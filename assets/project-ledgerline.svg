<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360" role="img" aria-labelledby="title desc">
<title id="title">Ledgerline</title>
<desc id="desc">Ledgerline: agentic financial intelligence platform. 84.6% answer accuracy on a 26-question agent evaluation; a LoRA fine-tuned 1.5B text-to-SQL model goes from 25% to 100% execution accuracy on held-out phrasings; hybrid retrieval with reranking reaches 0.88 recall at 6.</desc>
