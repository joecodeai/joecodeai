<title id="title">Tech stack</title>
<desc id="desc">Computer Vision: PyTorch, YOLO, OpenCV, DeepStream, TensorRT, ONNX Runtime, OpenVINO, GStreamer, Milvus; LLMs &amp; Agents: Llama 3, Qwen, Hugging Face, LangChain, LoRA / PEFT, RAG, Tool calling, MCP, Ollama; Backend &amp; Data: Python, FastAPI, PostgreSQL, Redis, SQLAlchemy, TypeScript, Next.js, Streamlit, C++; MLOps &amp; Cloud: Docker, Kubernetes, Helm, Terraform, GitHub Actions, Prometheus, Grafana, OpenTelemetry, GCP, Linux</desc>
