<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360" role="img" aria-labelledby="title desc">
<title id="title">StreamSight</title>
<desc id="desc">StreamSight: real-time multi-camera video analytics. 1,955 FPS total on DeepStream for three streams with detection, tracking and re-identification; YOLO11 detector at 1.3 ms p50 with TensorRT FP16; custom C++ DeepStream parser.</desc>
<style>.mono{font-family:'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}.sans{font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Ubuntu,Arial,sans-serif}@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}.pop{opacity:0;animation:pop .5s ease-out forwards}@keyframes blink{50%{opacity:.2}}.blink{animation:blink 1.4s ease-in-out infinite}@media (prefers-reduced-motion: reduce){.l,.chip,.pop,.rise{animation:none!important;opacity:1!important}}</style>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#05060d"/><stop offset="1" stop-color="#0c0a1f"/></linearGradient><linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset=".5" stop-color="#a855f7" stop-opacity=".4"/><stop offset="1" stop-color="#ec4899"/></linearGradient><filter id="glow" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="40"/></filter><linearGradient id="neon" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="240" y2="0" spreadMethod="reflect"><stop offset="0" stop-color="#22d3ee"/><stop offset=".35" stop-color="#3b82f6"/><stop offset=".7" stop-color="#a855f7"/><stop offset="1" stop-color="#ec4899"/><animateTransform attributeName="gradientTransform" type="translate" values="0 0;240 0;0 0" dur="6s" repeatCount="indefinite"/></linearGradient><clipPath id="cl"><rect width="1000" height="360" rx="20"/></clipPath></defs><rect x=".5" y=".5" width="999" height="359" rx="20" fill="url(#bg)" stroke="url(#edge)" stroke-opacity=".55"/><g clip-path="url(#cl)"><circle cx="880" cy="60" r="150" fill="#22d3ee" opacity=".12" filter="url(#soft)"/></g><text x="40" y="44" class="mono" font-size="12" fill="#22d3ee" letter-spacing="1.5">PROJECT 01 · COMPUTER VISION</text><text x="40" y="86" class="sans" font-size="38" font-weight="800" fill="#e2e8f0" letter-spacing="-.5">StreamSight</text><text x="40" y="116" class="sans" font-size="16" fill="#94a3b8">Real-time multi-camera video analytics: detection, tracking,</text><text x="40" y="139" class="sans" font-size="16" fill="#94a3b8">cross-camera re-identification, pose-based alerts, event API.</text><g class="pop" style="animation-delay:0.30s"><rect x="40" y="170" width="178" height="92" rx="12" fill="#ffffff" fill-opacity=".035" stroke="#ffffff" stroke-opacity=".09"/><text x="56" y="208" class="sans" font-size="27" font-weight="800" fill="url(#neon)">1,955 FPS</text><text x="56" y="231" class="mono" font-size="11" fill="#94a3b8">DeepStream, 3 streams</text><text x="56" y="247" class="mono" font-size="11" fill="#475569">detect + track + re-id</text></g><g class="pop" style="animation-delay:0.45s"><rect x="230" y="170" width="178" height="92" rx="12" fill="#ffffff" fill-opacity=".035" stroke="#ffffff" stroke-opacity=".09"/><text x="246" y="208" class="sans" font-size="27" font-weight="800" fill="url(#neon)">1.3 ms</text><text x="246" y="231" class="mono" font-size="11" fill="#94a3b8">YOLO11 detector p50</text><text x="246" y="247" class="mono" font-size="11" fill="#475569">TensorRT FP16</text></g><g class="pop" style="animation-delay:0.60s"><rect x="420" y="170" width="178" height="92" rx="12" fill="#ffffff" fill-opacity=".035" stroke="#ffffff" stroke-opacity=".09"/><text x="436" y="208" class="sans" font-size="27" font-weight="800" fill="url(#neon)">C++</text><text x="436" y="231" class="mono" font-size="11" fill="#94a3b8">custom DeepStream</text><text x="436" y="247" class="mono" font-size="11" fill="#475569">YOLO11 parser</text></g><rect x="40" y="296" width="58" height="22" rx="11" fill="#22d3ee" fill-opacity=".08" stroke="#22d3ee" stroke-opacity=".35"/><text x="49" y="311" class="mono" font-size="11" fill="#22d3ee">YOLO11</text><rect x="106" y="296" width="71" height="22" rx="11" fill="#22d3ee" fill-opacity=".08" stroke="#22d3ee" stroke-opacity=".35"/><text x="115" y="311" class="mono" font-size="11" fill="#22d3ee">TensorRT</text><rect x="184" y="296" width="84" height="22" rx="11" fill="#22d3ee" fill-opacity=".08" stroke="#22d3ee" stroke-opacity=".35"/><text x="193" y="311" class="mono" font-size="11" fill="#22d3ee">DeepStream</text><rect x="276" y="296" width="77" height="22" rx="11" fill="#22d3ee" fill-opacity=".08" stroke="#22d3ee" stroke-opacity=".35"/><text x="285" y="311" class="mono" font-size="11" fill="#22d3ee">ByteTrack</text><rect x="362" y="296" width="51" height="22" rx="11" fill="#22d3ee" fill-opacity=".08" stroke="#22d3ee" stroke-opacity=".35"/><text x="371" y="311" class="mono" font-size="11" fill="#22d3ee">OSNet</text><rect x="421" y="296" width="58" height="22" rx="11" fill="#22d3ee" fill-opacity=".08" stroke="#22d3ee" stroke-opacity=".35"/><text x="430" y="311" class="mono" font-size="11" fill="#22d3ee">Milvus</text><rect x="486" y="296" width="64" height="22" rx="11" fill="#22d3ee" fill-opacity=".08" stroke="#22d3ee" stroke-opacity=".35"/><text x="495" y="311" class="mono" font-size="11" fill="#22d3ee">FastAPI</text><rect x="640" y="92" width="150" height="92" rx="10" fill="#0b1020" stroke="#ffffff" stroke-opacity=".12"/><text x="649" y="108" class="mono" font-size="9.5" fill="#475569">CAM 01</text><circle cx="778" cy="104" r="3.5" fill="#ef4444" class="blink"/><line x1="646" x2="784" y1="170" y2="170" stroke="#ffffff" stroke-opacity=".06"/><g><animateTransform attributeName="transform" type="translate" values="0 0;40 0;0 0" dur="5s" repeatCount="indefinite"/><rect x="668" y="122" width="30" height="44" rx="3" fill="#22d3ee" fill-opacity=".1" stroke="#22d3ee" stroke-width="1.6"/><rect x="668" y="109" width="34" height="12" rx="2" fill="#22d3ee"/><text x="672" y="118" class="mono" font-size="9" fill="#05060d" font-weight="700">id 11</text></g><rect x="802" y="92" width="150" height="92" rx="10" fill="#0b1020" stroke="#ffffff" stroke-opacity=".12"/><text x="811" y="108" class="mono" font-size="9.5" fill="#475569">CAM 02</text><circle cx="940" cy="104" r="3.5" fill="#ef4444" class="blink"/><line x1="808" x2="946" y1="170" y2="170" stroke="#ffffff" stroke-opacity=".06"/><g><animateTransform attributeName="transform" type="translate" values="0 0;-24 0;0 0" dur="6s" repeatCount="indefinite"/><rect x="888" y="124" width="28" height="42" rx="3" fill="#ec4899" fill-opacity=".1" stroke="#ec4899" stroke-width="1.6"/><rect x="888" y="1